services:

  api:
    build:
      context: ./Api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Use internal Docker network port 5432, not host port 5433
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      JwtSettings__SecretKey: ${JWT_SECRET_KEY:-PosSystemSecretKey2024!@#$%^&*()_+={}[]|\\:;\"'<>,.?/}
      JwtSettings__Issuer: PosApi
      JwtSettings__Audience: PosClient
      JwtSettings__ExpirationMinutes: 60
      JwtSettings__RefreshTokenDays: 7
    depends_on:
      postgres:
        condition: service_healthy
      
  postgres:
    image: postgres:16-alpine
    container_name: postgres-pos
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data: